<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Trigger the Modal -->
    <img
      src="img2.jpg"
      alt="Snow"
      class="modal-trigger"
      style="width: 100%; max-width: 300px"
    />

    <!-- The Modal -->
    <div class="modal modal_hidden">
      <!-- The Close Button -->
      <span class="modal__close-btn">&times;</span>
      <!-- Modal Image -->
      <img src="img2.jpg" class="modal__image" />
      <!-- Modal Caption (Image Text) -->
      <div class="modal__caption">Winter</div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
