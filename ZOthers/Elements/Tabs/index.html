<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Tab links with id-->
    <div class="tab">
      <button class="tablink tablink_active" data-id="0">London</button>
      <button class="tablink" data-id="1">Paris</button>
      <button class="tablink" data-id="2">Tokyo</button>
    </div>

    <!-- Tab content in the same order as links-->
    <div id="London" class="tabcontent tabcontent_displayed">
      <h3>London</h3>
      <p>London is the capital city of England.</p>
    </div>

    <div id="Paris" class="tabcontent">
      <h3>Paris</h3>
      <p>Paris is the capital of France.</p>
    </div>

    <div id="Tokyo" class="tabcontent">
      <h3>Tokyo</h3>
      <p>Tokyo is the capital of Japan.</p>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
