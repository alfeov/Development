<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/dd21367a02.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <form action="#" method="post" class="form">
      <h1 class="form__title">Contact Us</h1>
      <div class="form__name-group">
        <label for="form__input_first-name" class="form__label form__label_req">
          First Name
        </label>
        <label for="form__input_last-name" class="form__label form__label_req">
          Last Name
        </label>
        <input
          type="text"
          id="form__input_first-name"
          class="form__input form__input_text"
          required
        />
        <input
          type="text"
          id="form__input_last-name"
          class="form__input form__input_text"
          required
        />
        <p class="errorMessage">This field is required</p>
        <p class="errorMessage">This field is required</p>
      </div>
      <div class="form__email-group">
        <label class="form__label form__label_req"> Email Address </label>
        <input type="email" class="form__input form__input_text" required />
        <p class="errorMessage">This field is required</p>
        <p class="errorMessage">Please enter a valid email address</p>
      </div>
      <div class="form__queries-group">
        <p class="form__query-text form__label form__label_req">Query Type</p>
        <div class="form__query-group">
          <input
            type="radio"
            name="form__radio"
            id="form__radio_general"
            class="form__radio"
            required
          />
          <label for="form__radio_general" class="form__label form__radio-label"
            >General Enquiry</label
          >
        </div>
        <div class="form__query-group">
          <input
            type="radio"
            name="form__radio"
            id="form__radio_support"
            class="form__radio"
          />
          <label for="form__radio_support" class="form__label form__radio-label"
            >Support Request</label
          >
        </div>
        <p class="errorMessage">Please select a query group</p>
      </div>
      <div class="form__message-group">
        <label for="form__textarea_message" class="form__label form__label_req">
          Message
        </label>
        <textarea
          id="form__textarea_message"
          class="form__textarea form__input_text"
          resize="none"
          required
        ></textarea>
        <p class="errorMessage">This field is required</p>
      </div>
      <div class="form__agreement-group">
        <input
          type="checkbox"
          id="form__checkbox_agreement"
          class="form__checkbox"
          required
        />
        <label
          for="form__checkbox_agreement"
          class="form__checkbox-label form__label form__label_req"
        >
          I consent to being contacted by the team
        </label>
        <p class="errorMessage">
          To submit this form, please consent to being contacted
        </p>
      </div>
      <input type="submit" value="Submit" class="form__submit-button" />
    </form>
  </body>
</html>
