<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/dd21367a02.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section class="contact-form-section">
      <h1 class="contact-form-section__title">Contact Us</h1>
      <form action="#" method="post" class="form contact-form-section__form">
        <div class="form__names-group">
          <div class="form__name-group">
            <label
              for="form__input_first-name"
              class="form__label form__label_req"
            >
              First Name
            </label>
            <input
              type="text"
              name="firstName"
              id="form__input_first-name"
              class="form__input form__input_text"
              required
            />
            <p class="errorMessage">This field is required</p>
          </div>
          <div class="form__name-group">
            <label
              for="form__input_last-name"
              class="form__label form__label_req"
            >
              Last Name
            </label>
            <input
              type="text"
              name="lastName"
              id="form__input_last-name"
              class="form__input form__input_text"
              required
            />
            <p class="errorMessage">This field is required</p>
          </div>
        </div>
        <div class="form__email-group">
          <label class="form__label form__label_req"> Email Address </label>
          <input
            type="email"
            name="email"
            class="form__input form__input_text"
            required
          />
          <p class="errorMessage">This field is required</p>
          <p class="errorMessage">Please enter a valid email address</p>
        </div>
        <div class="form__queries-group">
          <p class="form__query-text form__label form__label_req">Query Type</p>
          <label
            for="form__radio_general"
            class="form__label form__radio-label"
          >
            <input
              type="radio"
              name="queryType"
              id="form__radio_general"
              class="form__radio"
              required
            />
            <div class="form__custom-radio"></div>
            General Enquiry
          </label>

          <label
            for="form__radio_support"
            class="form__label form__radio-label"
          >
            <input
              type="radio"
              name="queryType"
              id="form__radio_support"
              class="form__radio"
            />
            <div class="form__custom-radio"></div>
            Support Request
          </label>

          <p class="errorMessage">Please select a query group</p>
        </div>
        <div class="form__message-group">
          <label
            for="form__textarea_message"
            class="form__label form__label_req"
          >
            Message
          </label>
          <textarea
            id="form__textarea_message"
            class="form__textarea form__input_text"
            required
          ></textarea>
          <p class="errorMessage">This field is required</p>
        </div>
        <div class="form__agreement-group">
          <input
            type="checkbox"
            name="agreement"
            id="form__checkbox_agreement"
            class="form__checkbox"
            required
          />
          <label
            for="form__checkbox_agreement"
            class="form__checkbox-label form__label form__label_req"
          >
            I consent to being contacted by the team
          </label>
          <p class="errorMessage">
            To submit this form, please consent to being contacted
          </p>
        </div>
        <input type="submit" value="Submit" class="form__submit-button" />
      </form>
    </section>
  </body>
</html>
