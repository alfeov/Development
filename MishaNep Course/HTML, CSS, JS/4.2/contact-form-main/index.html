<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact-Form</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <form action="#" method="post" class="contact-form">
      <h1 class="contact-form__title">Contact Us</h1>
      <div class="contact-form__name-group">
        <label
          for="fcontact-form__first-name-input"
          class="contact-form__first-name-label contact-form__label-req"
        >
          First Name
        </label>
        <input
          type="text"
          id="fcontact-form__first-name-input"
          class="fcontact-form__first-name-input text-area"
          required
        />
        <label
          for="contact-form__last-name-input"
          class="contact-form__last-name-label contact-form__label-req"
        >
          Last Name
        </label>
        <input
          type="text"
          id="contact-form__last-name-input"
          class="contact-form__last-name-input text-area"
          required
        />
      </div>
      <div class="contact-form__email-group">
        <label class="contact-form__email-label contact-form__label-req">
          Email Address
        </label>
        <input type="email" class="contact-form__email-input text-area" />
      </div>
      <div class="contact-form__queries-group">
        <p class="contact-form__query-text contact-form__label-req">
          Query Type
        </p>
        <div class="contact-form__query-group">
          <input
            type="radio"
            name="contact-form__query-radio"
            id="contact-form__query-radio-general"
            class="contact-form__query-radio"
            required
          />
          <label
            for="contact-form__query-radio-general"
            class="contact-form__query-label"
            >General Enquiry</label
          >
        </div>
        <div class="contact-form__query-group">
          <input
            type="radio"
            name="contact-form__query-radio"
            id="contact-form__query-radio-support"
            class="contact-form__query-radio"
          />
          <label
            for="contact-form__query-radio-support"
            class="contact-form__query-label"
            >Support Request</label
          >
        </div>
      </div>
      <div class="contact-form__message-group">
        <label
          for="contact-form__message-area"
          class="contact-form__message-label contact-form__label-req"
        >
          Message
        </label>
        <textarea
          id="contact-form__message-area"
          class="contact-form__message-area text-area"
          resize="none"
          required
        ></textarea>
      </div>
      <div class="contact-form__agreement-group">
        <input
          type="checkbox"
          id="contact-form__agreement-checkbox"
          class="contact-form__agreement-checkbox"
          required
        />
        <label
          for="contact-form__agreement-checkbox"
          class="contact-form__agreement-label contact-form__label-req"
        >
          I consent to being contacted by the team
        </label>
      </div>
      <input type="submit" value="Submit" class="contact-form__submit-button" />
    </form>
  </body>
</html>
