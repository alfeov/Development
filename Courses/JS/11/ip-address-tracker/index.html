<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Address Tracker</title>
  </head>
  <body>
    <main>
      <div class="finder">
        <h1 class="finder__title">IP Address Tracker</h1>
        <form id="searchBar" class="search-bar">
          <input
            type="text"
            class="search-bar__field"
            name="ip"
            id="searchField"
            placeholder="Search for any IP address of domain"
          />
          <input
            type="submit"
            class="search-bar__btn"
            value=""
            id="searchBtn"
          />
        </form>
        <div class="info">
          <div class="info__section">
            <p class="info__title">IP Address</p>
            <p class="info__text" id="ip">---</p>
          </div>
          <div class="info__section">
            <p class="info__title">Location</p>
            <p class="info__text" id="location">---</p>
          </div>
          <div class="info__section">
            <p class="info__title">Timezone</p>
            <p class="info__text">UTC: <span id="timezone">---</span></p>
          </div>
          <div class="info__section">
            <p class="info__title">ISP</p>
            <p class="info__text" id="isp">---</p>
          </div>
        </div>
      </div>
      <div id="map"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
