<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="slideshow">
      <!-- Slideshow container -->
      <div class="slideshow__slides-container">
        <!-- Full-width images with number and caption text -->
        <div class="slide">
          <div class="slide__number">1 / 3</div>
          <img src="img1.jpg" style="width: 100%" />
          <div class="slide__text">Caption Text</div>
        </div>

        <div class="slide slide_hidden">
          <div class="slide__number">2 / 3</div>
          <img src="img2.jpg" style="width: 100%" />
          <div class="slide__text">Caption Two</div>
        </div>

        <div class="slide slide_hidden">
          <div class="slide__number">3 / 3</div>
          <img src="img3.jpg" style="width: 100%" />
          <div class="slide__text">Caption Three</div>
        </div>

        <!-- Next and previous buttons -->
        <a class="slideshow__button slideshow__button_prev">&#10094;</a>
        <a class="slideshow__button slideshow__button_next">&#10095;</a>
      </div>
      <br />

      <!-- The dots/circles -->
      <div class="slideshow__dots-container">
        <span class="slideshow__dot"></span>
        <span class="slideshow__dot"></span>
        <span class="slideshow__dot"></span>
      </div>
    </div>
    <!-- ! LoDash connection -->
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.18.1/lodash.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
