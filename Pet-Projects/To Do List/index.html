<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do-list</title>
  </head>
  <body>
    <main class="todo">
      <h1 class="todo__title">To Do List</h1>
      <form id="addForm" class="todo__form">
        <input
          id="addField"
          class="todo__field todo__add-field"
          type="text"
          placeholder=" "
        />
        <label class="todo__label" for="addField">New task title</label>
        <input type="submit" class="todo__add-btn" value="Add" />
      </form>
      <form id="searchForm" class="todo__form">
        <input
          id="searchField"
          class="todo__field todo__search-field"
          type="search"
          placeholder=" "
        />
        <label class="todo__label" for="searchField">Search task</label>
        <input type="submit" class="todo__search-btn" value="" />
      </form>
      <div class="todo__info">
        <p>Total Tasks: <span id="taskCounter"></span></p>
        <button class="todo__delete-all-btn" id="deleteAllBtn">
          Delete All
        </button>
      </div>
      <ul class="todo__list">
        <li class="todo-item">
          <input type="checkbox" class="todo-item__checkbox" />
          <p class="todo-item__text">Some text...</p>
          <button class="todo-item__delete-btn"></button>
        </li>
        <li class="todo-item">
          <input type="checkbox" class="todo-item__checkbox" />
          <p class="todo-item__text">
            Lorem ipsum dolor sit amet consectetur adipisicing.
          </p>
          <button class="todo-item__delete-btn"></button>
        </li>
        <li class="todo-item">
          <input type="checkbox" class="todo-item__checkbox" />
          <p class="todo-item__text"></p>
          <button class="todo-item__delete-btn"></button>
        </li>
      </ul>
      <p class="todo__empty-message"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
